name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libfontconfig-dev libvulkan-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Build
        run: cargo build --workspace --release
      - name: Tests
        run: cargo test --workspace
      - name: Package binary
        run: |
          tar -czf officina-linux-x86_64.tar.gz -C target/release officina
          sha256sum officina-linux-x86_64.tar.gz > officina-linux-x86_64.tar.gz.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: officina-linux-x86_64
          path: |
            officina-linux-x86_64.tar.gz
            officina-linux-x86_64.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libfontconfig-dev libvulkan-dev
      - name: Build release binary
        run: cargo build --workspace --release -p officina-app
      - name: Package binary
        run: |
          tar -czf officina-linux-x86_64.tar.gz -C target/release officina
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: officina-linux-x86_64.tar.gz
          generate_release_notes: true