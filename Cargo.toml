[workspace]
resolver = "2"
members = ["crates/officina-core", "crates/officina-app"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "lzma", "zstd"] }
sevenz-rust = "0.6"
walkdir = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
image = "0.25"
tempfile = "3"
sha2 = "0.10"
